name: Release

# 打 tag（如 v0.2.0）自动构建 Android APK + H5，并附到 GitHub Release，
# 同时把 H5 发布到 GitHub Pages（gh-pages 分支模式）
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @lifepilot/shared build

      # android/ 原生工程随仓库提交（expo prebuild 已本地生成）；
      # 签名密钥从 GitHub Secret 解出，不入库
      - name: Restore release keystore
        working-directory: apps/mobile/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFEPILOT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > lifepilot-release.keystore
          fi
          # 缺密钥必须失败：静默回退会发布 debug 签名的"正式"APK（与既有安装不兼容且无法升级）
          [ -f lifepilot-release.keystore ] || { echo "::error::缺少签名密钥 Secret LIFEPILOT_KEYSTORE_BASE64"; exit 1; }

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          # 签名密码不再有代码内默认值（#11），必须经 Secret 注入
          LIFEPILOT_UPLOAD_STORE_PASSWORD: ${{ secrets.LIFEPILOT_UPLOAD_STORE_PASSWORD }}
          LIFEPILOT_UPLOAD_KEY_PASSWORD: ${{ secrets.LIFEPILOT_UPLOAD_KEY_PASSWORD }}
          # APK 内嵌的 API 地址：仓库 Variables 里配置 PUBLIC_API_BASE_URL（未设回退 localhost，仅模拟器/本地可用）
          EXPO_PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE_URL }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          # Release notes 只由 h5 job 生成一次：两个 job 都开会重复追加同一份变更记录

  h5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @lifepilot/shared build

      # GitHub Pages 部署在 <user>.github.io/<repo>/ 子路径，注入 baseUrl；
      # API 公网地址在仓库 Variables 里配置（PUBLIC_API_BASE_URL），未配置回退本地
      - name: Build H5
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE_URL }}
        run: pnpm exec expo export --platform web

      - name: SPA 回退（深链接刷新 404 修复）
        working-directory: apps/mobile/dist
        run: cp index.html 404.html

      - name: Package H5
        run: tar -czf h5-dist.tar.gz -C apps/mobile dist

      - name: Upload H5 to Release
        uses: softprops/action-gh-release@v2
        with:
          files: h5-dist.tar.gz
          generate_release_notes: true

      - name: Deploy H5 to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/mobile/dist
