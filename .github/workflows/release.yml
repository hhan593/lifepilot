name: Release

# 打 tag（如 v0.2.0）自动构建 Android APK + H5，并附到 GitHub Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @lifepilot/shared build

      # android/ 原生工程随仓库提交（expo prebuild 已本地生成），
      # 签名密钥 apps/mobile/android/app/lifepilot-release.keystore 一并入库（私有仓库）
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

  h5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @lifepilot/shared build

      # GitHub Pages 部署在 <user>.github.io/<repo>/ 子路径，注入 baseUrl
      - name: Build H5
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
        run: pnpm exec expo export --platform web

      - name: SPA 回退（深链接刷新 404 修复）
        working-directory: apps/mobile/dist
        run: cp index.html 404.html

      - name: Package H5
        run: tar -czf h5-dist.tar.gz -C apps/mobile dist

      - name: Upload H5 to Release
        uses: softprops/action-gh-release@v2
        with:
          files: h5-dist.tar.gz
          generate_release_notes: true

  deploy-pages:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: h5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @lifepilot/shared build

      - name: Build H5
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
        run: pnpm exec expo export --platform web

      - name: SPA 回退
        working-directory: apps/mobile/dist
        run: cp index.html 404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

      - id: deployment
        uses: actions/deploy-pages@v4
